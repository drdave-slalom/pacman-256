# Agent pipeline step 1 (SPEC/github-agent-pipeline.md, D057): a collaborator with
# triage or higher adds `agent:go` to an issue; Copilot is assigned with the
# factory-orchestrator profile to write the spec only. Logic lives in
# .github/scripts/agent-gate.mjs, loaded from the default branch.
name: Agent dispatch

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  dispatch:
    if: vars.AGENT_PIPELINE_ENABLED == 'true' && github.event.label.name == 'agent:go'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: agent-dispatch-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Check out pipeline scripts from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Assign Copilot to write the spec
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          AGENT_MAX_ACTIVE: ${{ vars.AGENT_MAX_ACTIVE }}
        with:
          script: |
            const { handleDispatch } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/agent-gate.mjs`);
            await handleDispatch({ github, context, core, env: process.env });
