# Repository labels for the pacman-256 factory (SPEC/github-tracker-integration.md §2).
# Sync with: node scripts/sync-labels.mjs [--dry-run] [--repo owner/name]
# GitHub default labels are kept; this file only adds/updates the labels below.
# Format: flat list of { name, color (6 hex digits, no #), description }.

- name: "type:feature"
  color: "1d76db"
  description: "New capability or factory unit"
- name: "type:bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "type:chore"
  color: "c5def5"
  description: "Tooling, config, or maintenance"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"

- name: "role:builder"
  color: "5319e7"
  description: "Implementation by the builder role"
- name: "role:qa"
  color: "5319e7"
  description: "Verification by the qa-tester role"
- name: "role:review"
  color: "5319e7"
  description: "Review by the pr-reviewer role"
- name: "role:design"
  color: "5319e7"
  description: "Gameplay design work"
- name: "role:art"
  color: "5319e7"
  description: "Visual or audio assets"
- name: "role:docs"
  color: "5319e7"
  description: "Docs-writer work"

- name: "lane:A"
  color: "0e8a16"
  description: "Lane A: rendering, input, mobile UX"
- name: "lane:B"
  color: "0e8a16"
  description: "Lane B: multiplayer, rules, room lifecycle"
- name: "lane:C"
  color: "0e8a16"
  description: "Lane C: networking, lobby/results, integration"

- name: "status:spec"
  color: "fef2c0"
  description: "Spec being written or approved"
- name: "status:ready"
  color: "bfdadc"
  description: "Spec approved; ready to dispatch"
- name: "status:in-progress"
  color: "fbca04"
  description: "Being implemented"
- name: "status:review"
  color: "d4c5f9"
  description: "In QA and review"

- name: "blocked"
  color: "b60205"
  description: "Cannot proceed; see comments"
- name: "follow-up"
  color: "f9d0c4"
  description: "Deferred finding from review or QA"
- name: "playtest"
  color: "ff7619"
  description: "Found or needs checking in a playtest"
